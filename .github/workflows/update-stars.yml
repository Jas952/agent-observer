name: Update Agent Observer card
on:
  workflow_dispatch:
  schedule:
    - cron: '27 4 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow cairosvg
      - run: python scripts/render_card.py --live --animate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated card
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/agent-observer-card.svg assets/agent-observer-card.webp assets/agent-observer-card.png
          git diff --cached --quiet || (git commit -m 'Update Agent Observer card' && git push)
